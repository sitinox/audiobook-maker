<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">

<title id="title">Audiobook Maker terminal demonstration</title>

<desc id="desc">A macOS Terminal window showing Audiobook Maker version 1.0.0, its configured project folder, one EPUB book ready for conversion, and prompts for output format and voice.</desc>

<rect width="1200" height="520" rx="18" fill="#171717"/>

<rect width="1200" height="56" rx="18" fill="#2b2b2b"/>

<circle cx="34" cy="28" r="9" fill="#ff5f57"/>

<circle cx="64" cy="28" r="9" fill="#febc2e"/>

<circle cx="94" cy="28" r="9" fill="#28c840"/>

<text x="600" y="35" text-anchor="middle" font-family="Menlo, monospace" font-size="18" fill="#f2f2f2">Audiobook Maker — Terminal</text>

<g font-family="Menlo, monospace" font-size="21" fill="#f2f2f2">

<text x="38" y="98">$ audiobook</text>

<text x="38" y="136">Audiobook Maker v1.0.0</text>

<text x="38" y="174">==========================</text>

<text x="38" y="220">Project folder: ~/Audiobook Maker</text>

<text x="38" y="258">Found 1 supported book:</text>

<text x="70" y="296">The Example Book.epub</text>

<text x="38" y="342">Choose output format:</text>

<text x="70" y="380">1. MP3 chapters</text>

<text x="70" y="418">2. M4B audiobook</text>

<text x="70" y="456">3. Both</text>

<text x="38" y="494">Choice:</text>

</g>

</svg>

