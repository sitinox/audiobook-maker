
[build-system]

requires = ["setuptools>=69"]

build-backend = "setuptools.build_meta"

[project]

name = "audiobook-maker"

dynamic = ["version"]

description = "An accessible macOS command-line tool for converting PDF, TXT, DOCX, and EPUB books into MP3 and M4B audiobooks."

readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

requires-python = ">=3.9"
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]

dependencies = [

    "beautifulsoup4>=4.12",

    "EbookLib>=0.18",

    "mutagen>=1.47",

    "pyobjc-framework-Cocoa>=10.3.2; platform_system == 'Darwin'",

    "python-docx>=1.1",

]

[project.urls]
Homepage = "https://github.com/sitinox/audiobook-maker"
Source = "https://github.com/sitinox/audiobook-maker"
Issues = "https://github.com/sitinox/audiobook-maker/issues"
Changelog = "https://github.com/sitinox/audiobook-maker/blob/main/CHANGELOG.md"

[project.scripts]

audiobook = "audiobook_maker.cli:main"

[tool.setuptools]

packages = ["audiobook_maker"]

[tool.setuptools.dynamic]

version = {attr = "audiobook_maker.__version__"}

[tool.setuptools.package-data]

audiobook_maker = ["CHANGELOG.md"]


[project.optional-dependencies]

dev = [

    "pytest>=8.0",
    "ruff>=0.16.0",

]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]

testpaths = ["tests"]

python_files = ["test_*.py"]
